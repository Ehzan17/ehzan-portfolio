services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ehzan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ehzan
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U ehzan"], interval: 10s, timeout: 5s, retries: 5 }
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ehzan:${POSTGRES_PASSWORD}@db:5432/ehzan
    depends_on: { migrate: { condition: service_completed_successfully } }
    volumes: [media_data:/app/public/uploads]
    healthcheck: { test: ["CMD","node","-e","fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 30s, timeout: 5s, retries: 3 }
  migrate:
    build:
      context: .
      target: builder
    command: npx prisma migrate deploy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ehzan:${POSTGRES_PASSWORD}@db:5432/ehzan
    depends_on: { db: { condition: service_healthy } }
    restart: "no"
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80"]
    volumes: [./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [app]
volumes: { postgres_data: {}, media_data: {} }
